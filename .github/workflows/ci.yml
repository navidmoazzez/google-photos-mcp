name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  smoke:
    # The build passing says nothing about whether the server actually starts
    # and lists its tools, which is the failure a user would actually hit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Handshake and list tools
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | node dist/index.js 2>/dev/null > out.jsonl
          node -e '
            const lines = require("fs").readFileSync("out.jsonl","utf8").trim().split("\n").map(JSON.parse);
            const list = lines.find((m) => m.id === 2);
            const count = list?.result?.tools?.length ?? 0;
            if (count < 20) { console.error("Only " + count + " tools listed"); process.exit(1); }
            console.log(count + " tools listed");
          '
